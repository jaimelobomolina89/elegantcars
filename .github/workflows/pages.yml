# Checks the YAML files and, if they are valid, publishes the site to GitHub
# Pages. A push with broken YAML is not published: the live site keeps the
# last good version, and the failed run shows which file and line to fix.
#
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Validate and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate YAML
        run: node .github/scripts/validate-yaml.js

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
