<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>elegantcars</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip_link"></a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo logo-pending" href="index.html" data-i18n-aria-label="logo_label"><span class="logo-text">elegant<span>cars</span></span></a>
      <div class="header-end">
        <nav data-i18n-aria-label="nav.label">
          <ul class="nav-list">
            <li><a href="index.html" data-i18n="nav.home"></a></li>
            <li><a href="filters.html" data-i18n="nav.filters"></a></li>
            <li><a href="stock.html" data-i18n="nav.stock"></a></li>
            <li><a href="contact.html" data-i18n="nav.contact"></a></li>
          </ul>
        </nav>
        <nav id="lang-switch" class="lang-switch"></nav>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <p class="back-link-wrap"><a id="back-link" class="back-link" href="stock.html" data-i18n="car.back"></a></p>
      <p id="load-error" class="load-error" role="alert" hidden></p>
    </div>

    <article id="car-detail" class="detail" hidden>
      <div id="car-media-slot" class="detail-hero"></div>

      <div class="container detail-layout">
        <div class="detail-main">
          <p id="car-meta" class="eyebrow"></p>
          <h1 id="car-name"></h1>
          <p id="car-tagline" class="lede"></p>
          <p id="car-description" class="detail-description"></p>
          <p id="car-price" class="detail-price"></p>
        </div>

        <aside class="detail-specs" aria-labelledby="specs-heading">
          <h2 id="specs-heading" data-i18n="car.specs"></h2>
          <dl id="car-specs" class="spec-table"></dl>
          <p class="detail-links">
            <a id="more-brand" href="stock.html"></a>
            <a id="more-type" href="stock.html"></a>
          </p>
        </aside>
      </div>
    </article>

    <div id="car-not-found" class="container" hidden>
      <div class="empty-state">
        <h1 data-i18n="car.not_found_title"></h1>
        <p data-i18n="car.not_found_text"></p>
        <p class="empty-actions"><a class="button" href="stock.html" data-i18n="stock.see_all"></a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-note"></p>
      <p><a href="credits.html" data-i18n="footer.credits"></a></p>
    </div>
  </footer>

  <script src="js/vendor/js-yaml/js-yaml.umd.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/car.js"></script>
</body>
</html>
