# English translations of the content in data/site.yaml.
# Only text needs translating. Anything missing here (a whole car, or one field)
# is shown in the default language (Spanish) from data/site.yaml.
# Cars and types are keyed by their id / slug from data/site.yaml.

site:
  footer: "© elegantcars. Specifications are indicative and prices are approximate starting prices."

home:
  eyebrow: The collection
  title: Cars that define modern luxury
  text: >-
    Hand-picked grand tourers, saloons and SUVs from the world's most
    desirable marques.
  button: Find your car
  image_alt: "The Nürburgring circuit winding through wooded hills"

contact:
  title: Contact us
  text: >-
    Interested in a car from our stock, or looking for something specific?
    Call or email us and we'll get back to you.

types:
  suv:
    name: SUV
  berlina:
    name: Sedan
  cabrio:
    name: Convertible
  coupe:
    name: Coupe

cars:
  ferrari-sf90-spider:
    tagline: The Ferrari SF90 Spider is a convertible supercar.
    engine: 4.0 L twin-turbo V8 with three electric motors
  aston-martin-dbx707:
    tagline: The SUV with a sports car's soul.
    description: >-
      Aston Martin's performance SUV takes its name from its 707 PS output. A
      wet-clutch nine-speed gearbox, carbon-ceramic brakes and sharpened
      chassis tuning keep it agile despite its size.
    engine: 4.0 L twin-turbo V8
  lamborghini-revuelto:
    tagline: The V12 flagship, electrified.
    description: >-
      Lamborghini's first high-performance hybrid keeps a naturally aspirated
      V12 at its heart and adds three electric motors. Scissor doors and a
      carbon monocoque complete a car built for theatre.
    engine: 6.5 L V12 plug-in hybrid
  porsche-macan-s:
    tagline: >-
      A mid-size sports SUV that combines the practicality of an SUV with
      Porsche's character and performance.
    description: >-
      A high-performance premium SUV that pairs a powerful engine, all-wheel
      drive and a PDK gearbox with sporty handling, while staying comfortable
      and practical enough for everyday use.
    engine: Twin-turbo petrol V6
  bmw-m8:
    tagline: >-
      The BMW M8 Competition is a luxury grand tourer with the heart of a
      supercar: comfortable on long journeys, and genuinely brutal when you
      push it.
    description: >-
      The M8 Competition is hard to pigeonhole. It isn't quite a pure sports
      car like a Porsche 911, nor simply a luxury saloon, nor a traditional
      GT. It's a blend of all three: grand tourer, sports car and luxury car.
      You can cover hundreds of kilometres in real comfort, in a car that
      also goes from 0 to 100 km/h in around 3.2 seconds.
    engine: 4.4 L TwinPower Turbo V8
