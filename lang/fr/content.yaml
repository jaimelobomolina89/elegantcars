# French translations of the content in data/site.yaml.
# Only text needs translating. Anything missing here (a whole car, or one field)
# is shown in the default language (Spanish) from data/site.yaml.
# Cars and types are keyed by their id / slug from data/site.yaml.

site:
  footer: "© elegantcars. Les caractéristiques sont données à titre indicatif et les prix sont des prix de départ approximatifs."

home:
  title: Bienvenue chez elegantcars
  text: >-
    Grand tourisme, berlines et SUV sélectionnés parmi les marques les plus
    prestigieuses au monde.
  button: Trouvez votre voiture
  image_alt: "Le circuit du Nürburgring serpentant à travers des collines boisées"

contact:
  title: Contactez-nous
  text: >-
    Une voiture de notre stock vous intéresse, ou vous cherchez un modèle
    précis ? Appelez-nous ou écrivez-nous et nous vous répondrons.

types:
  suv:
    name: SUV
  berlina:
    name: Berline
  cabrio:
    name: Cabriolet
  coupe:
    name: Coupé

cars:
  ferrari-sf90-spider:
    tagline: La Ferrari SF90 Spider est une supercar décapotable.
    engine: V8 biturbo 4,0 L avec trois moteurs électriques
  aston-martin-dbx707:
    tagline: Le SUV à l'âme de sportive.
    description: >-
      Le SUV hautes performances d'Aston Martin tire son nom de ses 707 ch.
      Une boîte à neuf rapports à embrayage humide, des freins
      carbone-céramique et un châssis affûté le gardent agile malgré sa
      taille.
    engine: V8 biturbo 4,0 L
  lamborghini-revuelto:
    tagline: Le vaisseau amiral V12, électrifié.
    description: >-
      La première hybride hautes performances de Lamborghini conserve un V12
      atmosphérique en son cœur et y ajoute trois moteurs électriques. Portes
      en élytre et monocoque en carbone complètent une voiture taillée pour le
      spectacle.
    engine: V12 6,5 L hybride rechargeable
  porsche-macan-s:
    tagline: >-
      Un SUV sportif de taille moyenne qui allie le côté pratique d'un SUV au
      caractère et aux performances propres à Porsche.
    description: >-
      Un SUV premium hautes performances qui associe un moteur puissant, une
      transmission intégrale, une boîte PDK et un comportement sportif à
      suffisamment de confort et de praticité pour un usage quotidien.
    engine: V6 biturbo essence
  bmw-m8:
    tagline: >-
      La BMW M8 Competition est une grand tourisme de luxe au cœur de
      supercar : confortable pour voyager, et d'une brutalité saisissante
      quand on la sollicite.
    description: >-
      La M8 Competition est difficile à classer. Ce n'est pas tout à fait une
      sportive pure comme une Porsche 911, ni une simple berline de luxe, ni
      une GT traditionnelle. C'est un mélange des trois : grand tourisme,
      sportive et voiture de luxe. Elle avale des centaines de kilomètres
      avec un vrai confort, tout en passant de 0 à 100 km/h en environ
      3,2 secondes.
    engine: V8 TwinPower Turbo 4,4 L
