<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>elegantcars</title>
  <meta name="description" content="Coches de alta gama disponibles en elegantcars.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page-title="page_titles.stock">
  <a class="skip-link" href="#main" data-i18n="skip_link"></a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo logo-pending" href="index.html" data-i18n-aria-label="logo_label"><span class="logo-text">elegant<span>cars</span></span></a>
      <div class="header-end">
        <nav data-i18n-aria-label="nav.label">
          <ul class="nav-list">
            <li><a href="index.html" data-i18n="nav.home"></a></li>
            <li><a href="filters.html" data-i18n="nav.filters"></a></li>
            <li><a href="contact.html" data-i18n="nav.contact"></a></li>
          </ul>
        </nav>
        <nav id="lang-switch" class="lang-switch"></nav>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <div class="page-intro">
      <p class="eyebrow" data-i18n="stock.eyebrow"></p>
      <h1 id="stock-title"></h1>
      <div id="active-filters" class="active-filters" hidden></div>
      <p id="results-status" class="results-status"></p>
    </div>

    <p id="load-error" class="load-error" role="alert" hidden></p>

    <div id="car-grid" class="car-grid"></div>

    <div id="empty-state" class="empty-state" hidden>
      <p data-i18n="stock.empty"></p>
      <p class="empty-actions">
        <a class="button" href="filters.html" data-i18n="stock.change_filters"></a>
        <a class="button button-ghost" href="stock.html" data-i18n="stock.see_all"></a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-note"></p>
      <p><a href="credits.html" data-i18n="footer.credits"></a></p>
    </div>
  </footer>

  <script src="js/vendor/js-yaml/js-yaml.umd.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/stock.js"></script>
</body>
</html>
