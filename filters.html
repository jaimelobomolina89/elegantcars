<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filters · elegantcars</title>
  <meta name="description" content="Browse the elegantcars stock by brand or by car type.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <span class="logo">elegant<span>cars</span></span>
      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="stock.html">Stock</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <div class="page-intro">
      <p class="eyebrow">Find your car</p>
      <h1>Filters</h1>
      <p class="lede">Choose a brand or a car type to see the matching cars in stock.</p>
    </div>

    <p id="load-error" class="load-error" role="alert" hidden></p>

    <section class="filter-group" aria-labelledby="brand-heading">
      <h2 id="brand-heading">By brand</h2>
      <ul id="brand-tiles" class="tile-grid tile-grid-brands"></ul>
    </section>

    <section class="filter-group" aria-labelledby="type-heading">
      <h2 id="type-heading">By car type</h2>
      <ul id="type-tiles" class="tile-grid"></ul>
    </section>

    <p class="all-link-wrap"><a id="all-link" href="stock.html" hidden>See all cars</a></p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-note"></p>
    </div>
  </footer>

  <script src="js/vendor/js-yaml/js-yaml.umd.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/filters.js"></script>
</body>
</html>
