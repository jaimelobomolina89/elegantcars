<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>elegantcars</title>
  <meta name="description" content="Cómo contactar con elegantcars por teléfono o correo electrónico.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page-title="page_titles.contact">
  <a class="skip-link" href="#main" data-i18n="skip_link"></a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo logo-pending" href="index.html" data-i18n-aria-label="logo_label"><span class="logo-text">elegant<span>cars</span></span></a>
      <div class="header-end">
        <nav data-i18n-aria-label="nav.label">
          <ul class="nav-list">
            <li><a href="index.html" data-i18n="nav.home"></a></li>
            <li><a href="filters.html" data-i18n="nav.filters"></a></li>
            <li><a href="stock.html" data-i18n="nav.stock"></a></li>
          </ul>
        </nav>
        <nav id="lang-switch" class="lang-switch"></nav>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <div class="page-intro">
      <p class="eyebrow" data-i18n="contact.eyebrow"></p>
      <h1 id="contact-title"></h1>
      <p id="contact-text" class="lede"></p>
    </div>

    <p id="load-error" class="load-error" role="alert" hidden></p>

    <div class="contact-grid">
      <div id="contact-phone-card" class="contact-card" hidden>
        <h2 data-i18n="contact.phone"></h2>
        <a id="contact-phone" class="contact-value" href=""></a>
      </div>
      <div id="contact-email-card" class="contact-card" hidden>
        <h2 data-i18n="contact.email"></h2>
        <a id="contact-email" class="contact-value" href=""></a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-note"></p>
    </div>
  </footer>

  <script src="js/vendor/js-yaml/js-yaml.umd.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
