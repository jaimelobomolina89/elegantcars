# elegantcars: the single source of content for the whole site.
#
# Edit this file and reload the page; no build step is needed.
# Tips:
#   - Quote anything starting with "#" (e.g. colours), otherwise YAML treats it as a comment.
#   - Indentation matters: use two spaces, never tabs.
#   - `brand` and `type` on each car must match a `slug` from the lists below.
#   - All images live in the images/ folder. To change one, replace the file
#     and keep its name.

# Languages. The default language's text is written in this file. Each other
# language translates it in lang/<code>/content.yaml (stock text) and
# lang/<code>/ui.yaml (menus, buttons, labels); anything not translated there
# is shown in the default language. To add a language, add it here and create
# its lang/<code>/ folder.
languages:
  default: es
  available:
    - code: es
      name: Español
      locale: es-ES
    - code: en
      name: English
      locale: en-GB
    - code: fr
      name: Français
      locale: fr-FR

site:
  footer: >-
    © elegantcars. Las especificaciones son orientativas y los precios son
    precios de partida aproximados. Las ilustraciones son estilizadas y no
    están a escala.

home:
  eyebrow: "La colección"
  title: "Coches que definen el lujo moderno"
  text: >-
    Gran turismos, berlinas y SUV seleccionados de las marcas más deseadas
    del mundo.
  button: "Encuentra tu coche"
  # Background media for the homepage hero. `image` is always required: it is
  # shown on its own, or used as the poster while a video loads.
  # To use a video, set `video` to an .mp4 path, e.g. images/hero.mp4.
  image: images/hero.jpg
  image_alt: >-
    Ilustración de un coupé gran turismo rojo en una carretera abierta al
    atardecer
  video: ""

# Contact page. Replace these placeholder details with your real ones.
contact:
  title: "Contacta con nosotros"
  text: >-
    ¿Te interesa algún coche de nuestro stock o buscas algo concreto?
    Llámanos o escríbenos y te responderemos.
  phone: "+1 555 0100"
  email: hello@example.com

# Order here is the order shown on the filters page.
# Logos: save each brand's logo as images/brands/<slug>.png (or .jpg, .jpeg,
# .svg; they are tried in that order). No entry here is needed. To use another
# file name, add `logo: images/brands/<file>` to the brand. If no logo file is
# found, the brand name is shown on its own.
# Backgrounds: when the stock is filtered by a brand, images/filters/<slug>.png
# (or .jpg, .jpeg, .svg) is shown faded behind the page. To use another file
# name, add `background: images/filters/<file>`. No file, no background.
brands:
  - slug: ferrari
    name: Ferrari
  - slug: aston-martin
    name: Aston Martin
  - slug: lamborghini
    name: Lamborghini
  - slug: porsche
    name: Porsche
  - slug: bmw
    name: BMW

# Car type images on the filters page: save each one as images/types/<slug>.png
# (or .jpg, .jpeg, .svg; they are tried in that order). No entry here is
# needed. To use another file name, add `image: images/types/<file>` to the
# type. If no image is found, a drawn illustration of the car type is shown.
types:
  - slug: suv
    name: "SUV"
  - slug: berlina
    name: "Berlina"
  - slug: cabrio
    name: "Cabrio"
  - slug: coupe
    name: "Coupé"

# The stock. Fields:
#   id            unique, lowercase, no spaces
#   brand, type   slugs from the lists above
#   color         paint colour for the fallback illustration (quoted hex)
#
# Photos: each car has a folder named after its id, with numbered photos:
#   images/cars/<id>/1.jpg, 2.jpg, 3.jpg, …
# Photo 1 is used on the stock page; the detail page shows them all in a
# carousel, in number order. To add a photo, just add the next number; no
# change to this file is needed. If a car has no photos, an illustration of
# its car type is shown instead.
#
#   images        optional list of photo paths, to use other file names or a
#                 custom order instead of the numbered convention, e.g.
#                   images:
#                     - images/cars/bmw-m5/front.jpg
#                     - images/cars/bmw-m5/interior.jpg
#   tagline       one line, shown on the stock card and the detail page
#   description   optional longer text, shown on the car's detail page
#   power         PS, acceleration: 0–100 km/h in seconds, top_speed: km/h
#   price         approximate starting price in euros
cars:
  - id: ferrari-sf90-spider
    brand: ferrari
    type: coupe
    model: SF90 spider
    year: 2024
    color: "#8c1c13"
    tagline: "La nuova dolce vita, en versión gran turismo."
    description: >-
      Un coupé 2+2 con motor delantero que cambia la agresividad por el
      aplomo. Capó largo, flancos limpios y un habitáculo dividido en dos
      cockpits hacen del Roma un Ferrari para cruzar continentes más que
      para batir tiempos por vuelta.
    engine: "V8 biturbo de 3,9 L"
    power: 620
    acceleration: 3.4
    top_speed: 320
    price: 230000

  - id: ferrari-296-gts
    brand: ferrari
    type: cabrio
    model: 296 GTS
    year: 2024
    color: "#b5121b"
    tagline: "Seis cilindros, un motor eléctrico y el cielo abierto."
    description: >-
      La versión con techo rígido retráctil de la berlinetta híbrida
      enchufable de Ferrari. Su compacto V6 se combina con un motor
      eléctrico para una respuesta instantánea, y el techo se pliega en
      catorce segundos.
    engine: "V6 biturbo de 3,0 L híbrido enchufable"
    power: 830
    acceleration: 2.9
    top_speed: 330
    price: 300000

  - id: ferrari-purosangue
    brand: ferrari
