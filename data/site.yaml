# elegantcars: the single source of content for the whole site.
#
# Edit this file and reload the page; no build step is needed.
# Tips:
#   - Quote anything starting with "#" (e.g. colours), otherwise YAML treats it as a comment.
#   - Indentation matters: use two spaces, never tabs.
#   - `brand` and `type` on each car must match a `slug` from the lists below.
#   - All images live in the images/ folder. To change one, replace the file
#     and keep its name.

site:
  footer: >-
    © elegantcars. Specifications are indicative and prices are approximate
    starting prices. Illustrations are stylised and not to scale.

home:
  eyebrow: The collection
  title: Cars that define modern luxury
  text: >-
    Hand-picked grand tourers, saloons and SUVs from the world's most
    desirable marques.
  button: Find your car
  # Background media for the homepage hero. `image` is always required: it is
  # shown on its own, or used as the poster while a video loads.
  # To use a video, set `video` to an .mp4 path, e.g. images/hero.mp4.
  image: images/hero.jpg
  image_alt: Illustration of a red grand-touring coupe on an open road at sunset
  video: ""

# Contact page. Replace these placeholder details with your real ones.
contact:
  title: Contact us
  text: >-
    Interested in a car from our stock, or looking for something specific?
    Call or email us and we'll get back to you.
  phone: "+1 555 0100"
  email: hello@example.com

# Order here is the order shown on the filters page.
# Logos: save each brand's logo as images/brands/<slug>.png (or .jpg, .jpeg,
# .svg; they are tried in that order). No entry here is needed. To use another
# file name, add `logo: images/brands/<file>` to the brand. If no logo file is
# found, the brand name is shown on its own.
brands:
  - slug: ferrari
    name: Ferrari
  - slug: aston-martin
    name: Aston Martin
  - slug: lamborghini
    name: Lamborghini
  - slug: porsche
    name: Porsche
  - slug: bmw
    name: BMW

# Car type images on the filters page: save each one as images/types/<slug>.png
# (or .jpg, .jpeg, .svg; they are tried in that order). No entry here is
# needed. To use another file name, add `image: images/types/<file>` to the
# type. If no image is found, a drawn illustration of the car type is shown.
types:
  - slug: suv
    name: SUV
  - slug: berlina
    name: Berlina
  - slug: cabrio
    name: Cabrio
  - slug: coupe
    name: Coupe

# The stock. Fields:
#   id            unique, lowercase, no spaces
#   brand, type   slugs from the lists above
#   color         paint colour for the fallback illustration (quoted hex)
#
# Photos: each car has a folder named after its id, with numbered photos:
#   images/cars/<id>/1.jpg, 2.jpg, 3.jpg, …
# Photo 1 is used on the stock page; the detail page shows them all in a
# carousel, in number order. To add a photo, just add the next number; no
# change to this file is needed. If a car has no photos, an illustration of
# its car type is shown instead.
#
#   images        optional list of photo paths, to use other file names or a
#                 custom order instead of the numbered convention, e.g.
#                   images:
#                     - images/cars/bmw-m5/front.jpg
#                     - images/cars/bmw-m5/interior.jpg
#   tagline       one line, shown on the stock card and the detail page
#   description   optional longer text, shown on the car's detail page
#   power         PS, acceleration: 0–100 km/h in seconds, top_speed: km/h
#   price         approximate starting price in euros
cars:
  - id: ferrari-sf90-spider
    brand: ferrari
    type: coupe
    model: SF90 spider
    year: 2024
    color: "#8c1c13"
    tagline: La nuova dolce vita, in grand-touring form.
    description: >-
      A front-engined 2+2 coupe that trades aggression for poise. Long bonnet,
      clean flanks and a cabin split into two cockpits make the Roma a Ferrari
      for crossing continents rather than chasing lap times.
    engine: 3.9 L twin-turbo V8
    power: 620
    acceleration: 3.4
    top_speed: 320
    price: 230000

  - id: ferrari-296-gts
    brand: ferrari
    type: cabrio
    model: 296 GTS
    year: 2024
    color: "#b5121b"
    tagline: Six cylinders, one electric motor, open sky.
    description: >-
      The retractable hard-top version of Ferrari's plug-in hybrid berlinetta.
      Its compact V6 pairs with an electric motor for instant response, and the
      roof folds away in fourteen seconds.
    engine: 3.0 L twin-turbo V6 plug-in hybrid
    power: 830
    acceleration: 2.9
    top_speed: 330
    price: 300000

  - id: ferrari-purosangue
    brand: ferrari
    type: suv
    model: Purosangue
    year: 2024
    color: "#4a1410"
    tagline: Four doors, four seats, twelve cylinders.
    description: >-
      Ferrari's first four-door, four-seater keeps a naturally aspirated V12 up
      front and rear-hinged back doors for easy access. Active suspension lets
      it ride like a limousine and corner like a sports car.
    engine: 6.5 L naturally aspirated V12
    power: 725
    acceleration: 3.3
    top_speed: 310
    price: 390000

  - id: aston-martin-dbx707
    brand: aston-martin
    type: suv
    model: DBX707
    year: 2024
    color: "#20473a"
    tagline: The SUV with a sports car's soul.
    description: >-
      Aston Martin's performance SUV takes its name from its 707 PS output. A
      wet-clutch nine-speed gearbox, carbon-ceramic brakes and sharpened chassis
      tuning keep it agile despite its size.
    engine: 4.0 L twin-turbo V8
    power: 707
    acceleration: 3.3
    top_speed: 310
    price: 250000

  - id: aston-martin-db12-volante
    brand: aston-martin
    type: cabrio
    model: DB12 Volante
    year: 2024
    color: "#2f5d50"
    tagline: The super tourer, with the roof down.
    description: >-
      The open-top DB12 pairs a twin-turbo V8 with a fabric roof that folds in
      seconds. Grand-touring comfort and a hand-finished cabin make it as suited
      to long journeys as to coastal roads.
    engine: 4.0 L twin-turbo V8
    power: 680
    acceleration: 3.7
    top_speed: 325
    price: 260000

  - id: lamborghini-revuelto
    brand: lamborghini
    type: coupe
    model: Revuelto
    year: 2024
    color: "#c9a227"
    tagline: The V12 flagship, electrified.
    description: >-
      Lamborghini's first high-performance hybrid keeps a naturally aspirated
      V12 at its heart and adds three electric motors. Scissor doors and a
      carbon monocoque complete a car built for theatre.
    engine: 6.5 L V12 plug-in hybrid
    power: 1015
    acceleration: 2.5
    top_speed: 350
    price: 500000

  - id: lamborghini-urus-se
    brand: lamborghini
    type: suv
    model: Urus SE
    year: 2025
    color: "#3f6b2a"
    tagline: The super SUV goes plug-in hybrid.
    description: >-
      The plug-in hybrid Urus combines a twin-turbo V8 with an electric motor
      for more power and an electric-only mode for silent city driving. It is
      still every inch a Lamborghini.
    engine: 4.0 L twin-turbo V8 plug-in hybrid
    power: 800
    acceleration: 3.4
    top_speed: 312
    price: 260000

  - id: porsche-911-turbo-s
    brand: porsche
    type: coupe
    model: 911 Turbo S
    year: 2025
    color: "#5a6470"
    tagline: The everyday hypercar.
    description: >-
      The latest 911 Turbo S adds hybrid assistance to its flat-six, sharpening
      response without diluting the car's legendary usability. All-wheel drive
      puts its power down in any weather.
    engine: 3.6 L twin-turbo flat-six hybrid
    power: 711
    acceleration: 2.5
    top_speed: 322
    price: 270000

  - id: porsche-panamera-turbo-s-e-hybrid
    brand: porsche
    type: berlina
    model: Panamera Turbo S E-Hybrid
    year: 2025
    color: "#1f2a44"
    tagline: Four-door comfort, sports car pace.
    description: >-
      Porsche's flagship four-door combines a twin-turbo V8 and an electric
      motor. Active suspension lets it switch between relaxed long-distance
      cruiser and track-capable sports saloon.
    engine: 4.0 L twin-turbo V8 plug-in hybrid
    power: 782
    acceleration: 2.9
    top_speed: 325
    price: 240000

  - id: bmw-m5
    brand: bmw
    type: berlina
    model: M5
    year: 2025
    color: "#2d3e50"
    tagline: The original super saloon, now electrified.
    description: >-
      The seventh-generation M5 adds a plug-in hybrid system to its twin-turbo
      V8, making it the most powerful M5 yet. It seats five in comfort and
      covers short trips on electric power alone.
    engine: 4.4 L twin-turbo V8 plug-in hybrid
    power: 727
    acceleration: 3.5
    top_speed: 305
    price: 145000
