    engine: "V12 atmosférico de 6,5 L"
    power: 725
    acceleration: 3.3
    top_speed: 310
    price: 390000

  - id: aston-martin-dbx707
    brand: aston-martin
    type: suv
    model: DBX707
    year: 2024
    color: "#20473a"
    tagline: "El SUV con alma de deportivo."
    description: >-
      El SUV de altas prestaciones de Aston Martin toma su nombre de sus 707
